<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The WELLness Collective</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sage: #7a8c6e;
      --cream: #faf7f2;
      --taupe-dark: #5c5042;
      --text-light: #7a6e62;
      --border: #e0d8ce;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .center {
      max-width: 480px;
    }
    .eyebrow {
      font-size: 0.6rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--sage);
      font-weight: 600;
      margin-bottom: 1.2rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      font-weight: 300;
      color: var(--taupe-dark);
      line-height: 1.15;
      margin-bottom: 1rem;
    }
    h1 span { color: var(--sage); }
    p {
      font-size: 0.82rem;
      color: var(--text-light);
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: var(--sage);
      margin: 1.5rem auto;
    }
    .coach-note {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-style: italic;
      color: var(--text-light);
    }
  </style>
</head>
<body>
  <div class="center">
    <div class="eyebrow">Healing · Renewal · Purpose</div>
    <h1>The <span>WELL</span>ness<br>Collective</h1>
    <div class="divider"></div>
    <p>Your personalized coaching portal is waiting.<br>Use the private link your coach shared with you to access your program.</p>
    <div class="coach-note">— Coach Briana Weber</div>
  </div>
</body>
</html>
